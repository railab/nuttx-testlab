# SPDX-License-Identifier: Apache-2.0
#
# Build-only check of the hardware defconfigs (boards/*/*/*/configs/hw-*)
# in the nuttx-testlab image. No board is attached: nothing is run.

name: Hardware build

on:
  workflow_call:
    inputs:
      build_image:
        description: "Build tools/docker locally instead of pulling the published image"
        type: boolean
        default: false
      nuttx_repo:
        type: string
        default: https://github.com/apache/nuttx
      nuttx_ref:
        type: string
        default: master
      apps_repo:
        type: string
        default: https://github.com/apache/nuttx-apps
      apps_ref:
        type: string
        default: master
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build tools/docker locally instead of pulling the published image"
        type: boolean
        default: false
      nuttx_repo:
        type: string
        default: https://github.com/apache/nuttx
      nuttx_ref:
        type: string
        default: master
      apps_repo:
        type: string
        default: https://github.com/apache/nuttx-apps
      apps_ref:
        type: string
        default: master

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compute default image name
        id: image_name
        shell: bash
        run: echo "default=ghcr.io/${GITHUB_REPOSITORY,,}/testlab:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ !inputs.build_image }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        if: ${{ !inputs.build_image }}
        id: pull
        shell: bash
        env:
          DEFAULT_IMAGE: ${{ steps.image_name.outputs.default }}
        run: |
          # Images published before the ARM toolchain was added lack
          # arm-none-eabi-gcc: build locally then.
          if docker pull "$DEFAULT_IMAGE" \
             && docker run --rm --entrypoint sh "$DEFAULT_IMAGE" -c 'command -v arm-none-eabi-gcc'; then
            echo "image=$DEFAULT_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no usable $DEFAULT_IMAGE; building tools/docker locally instead"
          fi

      - name: Set up Docker Buildx
        if: ${{ inputs.build_image || steps.pull.outputs.image == '' }}
        uses: docker/setup-buildx-action@v4

      - name: Build image locally
        if: ${{ inputs.build_image || steps.pull.outputs.image == '' }}
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: tools/docker
          push: false
          load: true
          tags: nuttx-testlab
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hardware defconfigs
        shell: bash
        env:
          NUTTX_REPO: ${{ inputs.nuttx_repo }}
          NUTTX_REF: ${{ inputs.nuttx_ref }}
          APPS_REPO: ${{ inputs.apps_repo }}
          APPS_REF: ${{ inputs.apps_ref }}
          IMAGE: ${{ steps.pull.outputs.image || 'nuttx-testlab' }}
        run: |
          docker run --rm -e NUTTX_REPO -e NUTTX_REF -e APPS_REPO -e APPS_REF \
            -v "$PWD:/src:ro" --entrypoint sh "$IMAGE" -c \
            'rsync -a --exclude external --exclude build --exclude result --exclude .venv /src/ /work/ && cd /work && sh tools/ci/build-hw.sh'
