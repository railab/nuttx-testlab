# Publish the Sphinx documentation to GitHub Pages on every push to
# master (Settings -> Pages -> Source: GitHub Actions).

name: Publish documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Documentation/requirements.txt

      - name: Install docs tools
        run: pip install -r Documentation/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build docs
        run: sphinx-build -W -b html Documentation Documentation/_build/html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/_build/html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
