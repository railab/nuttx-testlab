config:
  cwd: './external'
  build_dir: './build/sim/ip-pair'

product0:
  name: "sim-node0"
  cores:
    core0:
      name: 'main'
      device: 'sim'
      line_buffered: true
      defconfig: '../../boards/sim/sim/sim/configs/ip-pair'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000a"
        CONFIG_NETINIT_MACADDR_1: "0x002a0010"

product1:
  name: "sim-node1"
  cores:
    core0:
      name: 'main'
      device: 'sim'
      line_buffered: true
      defconfig: '../../boards/sim/sim/sim/configs/ip-pair'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000b"
        CONFIG_NETINIT_MACADDR_1: "0x002a0011"
