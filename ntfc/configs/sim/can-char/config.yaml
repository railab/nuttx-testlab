config:
  cwd: './external'
  build_dir: './build/sim/can-char'
  kv:
    CONFIG_DEBUG_SYMBOLS: "y"
    CONFIG_TESTLAB_CANTL: "y"
    CONFIG_NET_CAN: "n"
    CONFIG_CAN_RXFIFOSIZE: 64

product0:
  name: "sim-node0"
  cores:
    core0:
      name: 'main'
      device: 'sim'
      line_buffered: true
      defconfig: 'boards/sim/sim/sim/configs/can'

product1:
  name: "sim-node1"
  cores:
    core0:
      name: 'main'
      device: 'sim'
      line_buffered: true
      defconfig: 'boards/sim/sim/sim/configs/can'
