config:
  cwd: './external'
  build_dir: './build/qemu-intel64/ip-pair'

product0:
  name: "intel64-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 2G -smp 4 -cpu host -enable-kvm -nographic
                  -serial mon:stdio
                  -netdev tap,id=n0,ifname=tl-tap0,script=no,downscript=no
                  -device e1000,netdev=n0,mac=52:54:00:2a:00:10'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/ip-pair-node0'

product1:
  name: "intel64-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 2G -smp 4 -cpu host -enable-kvm -nographic
                  -serial mon:stdio
                  -netdev tap,id=n1,ifname=tl-tap1,script=no,downscript=no
                  -device e1000,netdev=n1,mac=52:54:00:2a:00:11'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/ip-pair-node1'
