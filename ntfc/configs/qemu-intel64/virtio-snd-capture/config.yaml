config:
  cwd: './external'
  build_dir: './build/qemu-intel64/virtio-snd-capture'

product:
  name: "qemu-intel64-virtio-snd-capture"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                 -audiodev none,id=snd0
                 -device virtio-sound-pci,audiodev=snd0'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/virtio-snd'
