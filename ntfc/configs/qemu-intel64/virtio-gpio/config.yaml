config:
  cwd: './external'
  build_dir: './build/qemu-intel64/virtio-gpio'

product:
  name: "qemu-intel64-virtio-gpio"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'python3'
      exec_args: 'ntfc/tests/_vhost_user.py --device gpio
                 --socket /tmp/tl-vu-qemu-intel64-gpio.sock --ctl /tmp/tl-vu-qemu-intel64-gpio.ctl
                 -- qemu-system-x86_64
                 -m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                 -machine memory-backend=mem
                 -object memory-backend-memfd,id=mem,size=1G,share=on
                 -chardev socket,id=vu,path=/tmp/tl-vu-qemu-intel64-gpio.sock
                 -device vhost-user-device-pci,chardev=vu,virtio-id=41,num_vqs=2,config_size=8
                 -kernel $IMAGE_ELF'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/virtio-gpio'
