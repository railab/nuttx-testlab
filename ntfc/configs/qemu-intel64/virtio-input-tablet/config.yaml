config:
  cwd: './external'
  build_dir: './build/qemu-intel64/virtio-input-tablet'

product:
  name: "qemu-intel64-virtio-input-tablet"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                 -device virtio-keyboard-pci -device virtio-tablet-pci
                 -qmp unix:/tmp/tl-qmp-qemu-intel64-tablet.sock,server=on,wait=off'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/virtio-input'
