config:
  cwd: './external'
  build_dir: './build/qemu-intel64/sqlite'

product:
  name: "qemu-intel64-sqlite"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 1G -cpu host -enable-kvm -nographic
                  -chardev stdio,id=con,mux=on,logfile=build/sqlite/qemu-intel64-sqlite/console.log
                  -serial chardev:con -mon chardev=con,mode=readline
                  -fsdev local,id=tlfs,path=build/sqlite/qemu-intel64-sqlite/share,security_model=none
                  -device virtio-9p-pci,fsdev=tlfs,mount_tag=tlshare
                  -drive file=build/sqlite/qemu-intel64-sqlite/disk0.img,if=none,format=raw,id=tld0
                  -device virtio-blk-pci,drive=tld0
                  -drive file=build/sqlite/qemu-intel64-sqlite/disk1.img,if=none,format=raw,id=tld1
                  -device virtio-blk-pci,drive=tld1'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/sqlite'
