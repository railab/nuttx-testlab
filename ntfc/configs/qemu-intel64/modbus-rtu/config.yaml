config:
  cwd: './external'
  build_dir: './build/qemu-intel64/modbus-rtu'

product:
  name: "qemu-intel64-modbus-rtu"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                  -chardev serial,id=mb0,path=/dev/ttyTL0
                  -serial chardev:mb0'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/modbus-rtu'
