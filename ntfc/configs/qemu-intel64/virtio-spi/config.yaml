config:
  cwd: './external'
  build_dir: './build/qemu-intel64/virtio-spi'

product:
  name: "qemu-intel64-virtio-spi"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'python3'
      exec_args: 'ntfc/tests/_vhost_user.py --device spi
                 --socket /tmp/tl-vu-qemu-intel64-spi.sock --ctl /tmp/tl-vu-qemu-intel64-spi.ctl
                 -- /opt/qemu-11/bin/qemu-system-x86_64
                 -m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                 -machine memory-backend=mem
                 -object memory-backend-memfd,id=mem,size=1G,share=on
                 -chardev socket,id=vu,path=/tmp/tl-vu-qemu-intel64-spi.sock
                 -device vhost-user-spi-pci,chardev=vu
                 -kernel $IMAGE_ELF'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/virtio-spi'
