config:
  cwd: './external'
  build_dir: './build/qemu-intel64/v9fs'

product:
  name: "qemu-intel64-v9fs"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      exec_path: 'qemu-system-x86_64'
      exec_args: '-m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                  -fsdev local,id=tlfs,path=build/v9fs/qemu-intel64-v9fs,security_model=none
                  -device virtio-9p-pci,fsdev=tlfs,mount_tag=tlshare'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/v9fs'
