config:
  cwd: './external'
  build_dir: './build/qemu-intel64/virtio-i2c'

product:
  name: "qemu-intel64-virtio-i2c"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      exec_path: 'python3'
      exec_args: 'ntfc/tests/_vhost_user.py --device i2c
                 --socket /tmp/tl-vu-qemu-intel64-i2c.sock --ctl /tmp/tl-vu-qemu-intel64-i2c.ctl
                 -- qemu-system-x86_64
                 -m 1G -cpu host -enable-kvm -nographic -serial mon:stdio
                 -machine memory-backend=mem
                 -object memory-backend-memfd,id=mem,size=1G,share=on
                 -chardev socket,id=vu,path=/tmp/tl-vu-qemu-intel64-i2c.sock
                 -device vhost-user-i2c-pci,chardev=vu
                 -kernel $IMAGE_ELF'
      defconfig: '../../boards/x86_64/qemu/qemu-intel64/configs/virtio-i2c'
