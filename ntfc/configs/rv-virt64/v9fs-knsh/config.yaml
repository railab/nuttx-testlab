#
# Kernel build (S-mode under the QEMU default OpenSBI, so no -bios none):
# NTFC starts QEMU in the build directory, so tlbin (path=.)
# exports the build with the programs in bin/ and the tlfs path is
# relative to it (build/v9fs/rv-virt64-v9fs-knsh).

config:
  cwd: './external'
  build_dir: './build/rv-virt64/v9fs-knsh'

product:
  name: "rv-virt64-v9fs-knsh"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv64'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv64 -smp 1 -nographic
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlbin,security_model=none,readonly=on,path=.
                  -device virtio-9p-device,fsdev=tlbin,mount_tag=tlbin
                  -fsdev local,id=tlfs,path=../../../v9fs/rv-virt64-v9fs-knsh,security_model=none
                  -device virtio-9p-device,fsdev=tlfs,mount_tag=tlshare'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/v9fs64-knsh'
