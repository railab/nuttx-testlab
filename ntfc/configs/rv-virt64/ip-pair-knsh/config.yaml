# SPDX-License-Identifier: Apache-2.0
#
# Kernel build (S-mode under the QEMU default OpenSBI, so no -bios none):
# NTFC starts QEMU in each node's build directory, so tlbin
# (path=.) exports that build with the programs in bin/.

config:
  cwd: './external'
  build_dir: './build/rv-virt64/ip-pair-knsh'

product0:
  name: "rv-virt64-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv64'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv64 -smp 1 -nographic
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlbin,security_model=none,readonly=on,path=.
                  -device virtio-9p-device,fsdev=tlbin,mount_tag=tlbin
                  -netdev tap,id=n0,ifname=tl-tap0,script=no,downscript=no
                  -device virtio-net-device,netdev=n0,mac=52:54:00:2a:00:10'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/ip-pair64-knsh-node0'

product1:
  name: "rv-virt64-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv64'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv64 -smp 1 -nographic
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlbin,security_model=none,readonly=on,path=.
                  -device virtio-9p-device,fsdev=tlbin,mount_tag=tlbin
                  -netdev tap,id=n1,ifname=tl-tap1,script=no,downscript=no
                  -device virtio-net-device,netdev=n1,mac=52:54:00:2a:00:11'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/ip-pair64-knsh-node1'
