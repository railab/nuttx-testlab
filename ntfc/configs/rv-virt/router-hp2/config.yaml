config:
  cwd: './external'
  build_dir: './build/rv-virt/router-hp2'

product0:
  name: "rv-virt-router"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv32'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv32 -smp 4
                  -bios none -nographic
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n0,ifname=tl-rtap0,script=no,downscript=no
                  -device virtio-net-device,netdev=n0,mac=52:54:00:33:00:10
                  -netdev tap,id=n1,ifname=tl-rtap1,script=no,downscript=no
                  -device virtio-net-device,netdev=n1,mac=52:54:00:33:00:20'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/router-hp2'
