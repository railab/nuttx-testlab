config:
  cwd: './external'
  build_dir: './build/rv-virt/v9fs'

product:
  name: "rv-virt-v9fs"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv32'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv32 -smp 1
                  -bios none -nographic
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlfs,path=build/v9fs/rv-virt-v9fs,security_model=none
                  -device virtio-9p-device,fsdev=tlfs,mount_tag=tlshare'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/v9fs'
