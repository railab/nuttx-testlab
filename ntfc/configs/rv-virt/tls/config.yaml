config:
  cwd: './external'
  build_dir: './build/rv-virt/tls'

product:
  name: "rv-virt-tls"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-riscv32'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv32 -smp 1
                  -bios none -nographic
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n0,ifname=tl-tap0,script=no,downscript=no
                  -device virtio-net-device,netdev=n0,mac=52:54:00:2a:00:10
                  -device virtio-rng-device'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/tls'
