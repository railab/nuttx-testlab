config:
  cwd: './external'
  build_dir: './build/rv-virt/virtio-snd-capture'

product:
  name: "rv-virt-virtio-snd-capture"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'qemu-system-riscv32'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv32 -smp 1
                 -bios none -nographic
                 -global virtio-mmio.force-legacy=false
                 -audiodev none,id=snd0
                 -device virtio-sound-device,audiodev=snd0'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/virtio-snd'
