config:
  cwd: './external'
  build_dir: './build/rv-virt/vsock'

product:
  name: "rv-virt-vsock"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'qemu-system-riscv32'
      exec_args: '-semihosting -M virt,aclint=on -cpu rv32 -smp 1
                 -bios none -nographic
                 -global virtio-mmio.force-legacy=false
                 -device vhost-vsock-device,guest-cid=104'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/vsock'
