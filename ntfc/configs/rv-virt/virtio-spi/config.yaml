config:
  cwd: './external'
  build_dir: './build/rv-virt/virtio-spi'

product:
  name: "rv-virt-virtio-spi"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'python3'
      exec_args: 'ntfc/tests/_vhost_user.py --device spi
                 --socket /tmp/tl-vu-rv-virt-spi.sock --ctl /tmp/tl-vu-rv-virt-spi.ctl
                 -- /opt/qemu-11/bin/qemu-system-riscv32
                 -semihosting -M virt,aclint=on,memory-backend=mem -cpu rv32 -smp 1
                 -m 128M -object memory-backend-memfd,id=mem,size=128M,share=on
                 -bios none -nographic
                 -global virtio-mmio.force-legacy=false
                 -chardev socket,id=vu,path=/tmp/tl-vu-rv-virt-spi.sock
                 -device vhost-user-spi-device,chardev=vu
                 -kernel $IMAGE_ELF'
      defconfig: '../../boards/risc-v/qemu-rv/rv-virt/configs/virtio-spi'
