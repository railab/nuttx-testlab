config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/smoke'
  kv:
    CONFIG_DEBUG_SYMBOLS: "y"
    CONFIG_TESTLAB_NETTL: "y"
    CONFIG_NET: "y"
    CONFIG_NET_TCP: "y"
    CONFIG_NET_UDP: "y"
    CONFIG_NET_LOOPBACK: "y"
    CONFIG_NET_SOCKOPTS: "y"
    CONFIG_SCHED_WORKQUEUE: "y"
    CONFIG_SCHED_HPWORK: "y"
    CONFIG_NETDEV_LATEINIT: "y"

product:
  name: "qemu-armv8a-smoke"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                 -machine virt,virtualization=on,gic-version=3
                 -net none -chardev stdio,id=con,mux=on
                 -serial chardev:con -mon chardev=con,mode=readline'
      defconfig: 'boards/arm64/qemu/qemu-armv8a/configs/nsh'
