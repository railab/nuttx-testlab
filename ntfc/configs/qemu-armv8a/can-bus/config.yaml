config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/can-bus'

product0:
  name: "armv8a-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=2
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -object can-bus,id=canbus0
                  -object can-host-socketcan,id=canhost0,if=can0,canbus=canbus0
                  -object can-bus,id=canbus1
                  -device ctucan_pci,canbus0=canbus0,canbus1=canbus1'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/can-bus'

product1:
  name: "armv8a-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=2
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -object can-bus,id=canbus0
                  -object can-host-socketcan,id=canhost0,if=can0,canbus=canbus0
                  -object can-bus,id=canbus1
                  -device ctucan_pci,canbus0=canbus0,canbus1=canbus1'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/can-bus'
