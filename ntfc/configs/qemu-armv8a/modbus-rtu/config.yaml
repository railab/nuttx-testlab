config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/modbus-rtu'

product:
  name: "qemu-armv8a-modbus-rtu"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -net none -chardev stdio,id=con,mux=on
                  -serial chardev:con -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -device virtio-serial-device
                  -chardev serial,id=mb0,path=/dev/ttyTL0
                  -device virtconsole,chardev=mb0'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/modbus-rtu'
