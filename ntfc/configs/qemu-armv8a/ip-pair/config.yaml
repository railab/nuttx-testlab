config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/ip-pair'

product0:
  name: "armv8a-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n0,ifname=tl-tap0,script=no,downscript=no
                  -device virtio-net-device,netdev=n0,mac=52:54:00:2a:00:10'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/ip-pair'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000a"

product1:
  name: "armv8a-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n1,ifname=tl-tap1,script=no,downscript=no
                  -device virtio-net-device,netdev=n1,mac=52:54:00:2a:00:11'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/ip-pair'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000b"
