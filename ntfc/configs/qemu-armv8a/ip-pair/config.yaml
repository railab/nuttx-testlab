config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/ip-pair'
  kv:
    CONFIG_DEBUG_SYMBOLS: "y"
    CONFIG_TESTLAB_NETTL: "y"
    CONFIG_TESTLAB_NETTL_BUFSIZE: 1024
    CONFIG_SYSTEM_PING: "y"
    CONFIG_NET_SOCKOPTS: "y"
    CONFIG_SCHED_WORKQUEUE: "y"
    CONFIG_SCHED_HPWORK: "y"
    CONFIG_NETDEV_LATEINIT: "y"
    CONFIG_NET_TCP_WRITE_BUFFERS: "y"
    CONFIG_NET_UDP_WRITE_BUFFERS: "y"
    CONFIG_IOB_NBUFFERS: 256
    CONFIG_NET_TCP_PREALLOC_CONNS: 16
    CONFIG_NET_UDP_PREALLOC_CONNS: 16
    CONFIG_NETINIT_DRIPADDR: "0x0a2a0001"
    CONFIG_NETINIT_NOMAC: "n"

product0:
  name: "armv8a-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n0,ifname=tl-tap0,script=no,downscript=no
                  -device virtio-net-device,netdev=n0,mac=52:54:00:2a:00:10'
      defconfig: 'boards/arm64/qemu/qemu-armv8a/configs/netnsh'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000a"

product1:
  name: "armv8a-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n1,ifname=tl-tap1,script=no,downscript=no
                  -device virtio-net-device,netdev=n1,mac=52:54:00:2a:00:11'
      defconfig: 'boards/arm64/qemu/qemu-armv8a/configs/netnsh'
      kv:
        CONFIG_NETINIT_IPADDR: "0x0a2a000b"
