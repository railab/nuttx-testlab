config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/router'

product0:
  name: "armv8a-router"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -smp 4 -nographic
                  -machine virt,virtualization=on,gic-version=2
                  -chardev stdio,id=con,mux=on -serial chardev:con
                  -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -netdev tap,id=n0,ifname=tl-rtap0,script=no,downscript=no
                  -device e1000,netdev=n0,mac=52:54:00:33:00:10
                  -netdev tap,id=n1,ifname=tl-rtap1,script=no,downscript=no
                  -device virtio-net-device,netdev=n1,mac=52:54:00:33:00:20'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/router'
