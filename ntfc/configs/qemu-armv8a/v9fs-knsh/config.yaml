# SPDX-License-Identifier: Apache-2.0
#
# Kernel build: NTFC starts QEMU in the build directory, so tlbin (path=.)
# exports the build with the programs in bin/ and the tlfs path is
# relative to it (build/v9fs/qemu-armv8a-v9fs-knsh).

config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/v9fs-knsh'

product:
  name: "qemu-armv8a-v9fs-knsh"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -net none -chardev stdio,id=con,mux=on
                  -serial chardev:con -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlbin,security_model=none,readonly=on,path=.
                  -device virtio-9p-device,fsdev=tlbin,mount_tag=tlbin
                  -fsdev local,id=tlfs,path=../../../v9fs/qemu-armv8a-v9fs-knsh,security_model=none
                  -device virtio-9p-device,fsdev=tlfs,mount_tag=tlshare'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/v9fs-knsh'
