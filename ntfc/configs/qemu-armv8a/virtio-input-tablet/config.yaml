config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/virtio-input-tablet'

product:
  name: "qemu-armv8a-virtio-input-tablet"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                 -machine virt,virtualization=on,gic-version=3
                 -net none -chardev stdio,id=con,mux=on
                 -serial chardev:con -mon chardev=con,mode=readline
                 -global virtio-mmio.force-legacy=false
                 -device virtio-keyboard-device -device virtio-tablet-device
                 -qmp unix:/tmp/tl-qmp-qemu-armv8a-tablet.sock,server=on,wait=off'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/virtio-input'
