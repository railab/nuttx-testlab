# Both nodes map the same ivshmem file. Node 0 (rptun master) boots first
# and starts from a new, zeroed file each time: the rptun handshake in the
# shared memory does not survive a reboot.

config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/rpmsg'

product0:
  name: "armv8a-rpmsg-node0"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'sh'
      exec_args: "-c 'rm -f /dev/shm/tl-rpmsg-armv8a;
                  exec qemu-system-aarch64 -kernel $IMAGE_ELF
                  -cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -net none -chardev stdio,id=con,mux=on
                  -serial chardev:con -mon chardev=con,mode=readline
                  -device ivshmem-plain,memdev=tlshm,addr=0xb
                  -object memory-backend-file,id=tlshm,share=yes,size=4M,mem-path=/dev/shm/tl-rpmsg-armv8a'"
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/rpmsg-node0'

product1:
  name: "armv8a-rpmsg-node1"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -net none -chardev stdio,id=con,mux=on
                  -serial chardev:con -mon chardev=con,mode=readline
                  -device ivshmem-plain,memdev=tlshm,addr=0xb
                  -object memory-backend-file,id=tlshm,share=yes,size=4M,mem-path=/dev/shm/tl-rpmsg-armv8a'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/rpmsg-node1'
