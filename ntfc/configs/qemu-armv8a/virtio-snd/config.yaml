config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/virtio-snd'

product:
  name: "qemu-armv8a-virtio-snd"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                 -machine virt,virtualization=on,gic-version=3
                 -net none -chardev stdio,id=con,mux=on
                 -serial chardev:con -mon chardev=con,mode=readline
                 -global virtio-mmio.force-legacy=false
                 -audiodev wav,id=snd0,path=/tmp/tl-snd-qemu-armv8a.wav,out.mixing-engine=off
                 -device virtio-sound-device,audiodev=snd0'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/virtio-snd'
