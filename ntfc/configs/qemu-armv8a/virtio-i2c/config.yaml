config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/virtio-i2c'

product:
  name: "qemu-armv8a-virtio-i2c"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      line_buffered: true
      exec_path: 'python3'
      exec_args: 'ntfc/tests/_vhost_user.py --device i2c
                 --socket /tmp/tl-vu-qemu-armv8a-i2c.sock --ctl /tmp/tl-vu-qemu-armv8a-i2c.ctl
                 -- qemu-system-aarch64
                 -cpu cortex-a53 -nographic
                 -machine virt,virtualization=on,gic-version=3,memory-backend=mem
                 -m 128M -object memory-backend-memfd,id=mem,size=128M,share=on
                 -net none -chardev stdio,id=con,mux=on
                 -serial chardev:con -mon chardev=con,mode=readline
                 -global virtio-mmio.force-legacy=false
                 -chardev socket,id=vu,path=/tmp/tl-vu-qemu-armv8a-i2c.sock
                 -device vhost-user-i2c-device,chardev=vu
                 -kernel $IMAGE_ELF'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/virtio-i2c'
