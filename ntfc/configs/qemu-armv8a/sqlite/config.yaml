config:
  cwd: './external'
  build_dir: './build/qemu-armv8a/sqlite'

product:
  name: "qemu-armv8a-sqlite"
  cores:
    core0:
      name: 'main'
      device: 'qemu'
      boot_timeout: 30
      line_buffered: true
      exec_path: 'qemu-system-aarch64'
      exec_args: '-cpu cortex-a53 -nographic
                  -machine virt,virtualization=on,gic-version=3
                  -net none -chardev stdio,id=con,mux=on,logfile=build/sqlite/qemu-armv8a-sqlite/console.log
                  -serial chardev:con -mon chardev=con,mode=readline
                  -global virtio-mmio.force-legacy=false
                  -fsdev local,id=tlfs,path=build/sqlite/qemu-armv8a-sqlite/share,security_model=none
                  -device virtio-9p-device,fsdev=tlfs,mount_tag=tlshare
                  -drive file=build/sqlite/qemu-armv8a-sqlite/disk0.img,if=none,format=raw,id=tld0
                  -device virtio-blk-device,drive=tld0
                  -drive file=build/sqlite/qemu-armv8a-sqlite/disk1.img,if=none,format=raw,id=tld1
                  -device virtio-blk-device,drive=tld1'
      defconfig: '../../boards/arm64/qemu/qemu-armv8a/configs/sqlite'
