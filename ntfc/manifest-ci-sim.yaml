# SPDX-License-Identifier: Apache-2.0

options:
  fail_fast: false
  parallel: false

sessions:
  - name: "sim-smoke"
    confpath: ntfc/configs/sim/smoke/config.yaml
    testpath: ntfc/tests/smoke
  - name: "sim-ip-pair"
    confpath: ntfc/configs/sim/ip-pair/config.yaml
    testpath: ntfc/tests/ip
    resources: [tl-br0]
  - name: "sim-can-bus"
    confpath: ntfc/configs/sim/can-bus/config.yaml
    testpath: ntfc/tests/can
    resources: [can0]
  - name: "sim-can-char"
    confpath: ntfc/configs/sim/can-char/config.yaml
    testpath: ntfc/tests/can
    resources: [can0]
  - name: "sim-modbus-rtu"
    confpath: ntfc/configs/sim/modbus-rtu/config.yaml
    testpath: ntfc/tests/modbus
    resources: [ttyTL0]
