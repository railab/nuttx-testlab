[tox]
envlist = lint, flake8

[testenv:format]
description = Format code (isort + black)
skip_install = True
deps =
    black
    isort
commands =
    isort --settings-path=pyproject.toml . ../tools/ci ../Documentation
    black --config=pyproject.toml . ../tools/ci ../Documentation

[testenv:lint]
description = Check formatting (isort + black)
skip_install = True
deps =
    black
    isort
commands =
    isort --check-only --diff --settings-path=pyproject.toml . ../tools/ci ../Documentation
    black --check --diff --config=pyproject.toml . ../tools/ci ../Documentation

[testenv:flake8]
description = Lint with flake8 and NTFC plugins
skip_install = True
deps =
    flake8
    flake8-bugbear
    flake8-builtins
    flake8-docstrings>=1.3.1
    pep8-naming
commands =
    flake8 . ../tools/ci ../Documentation

[flake8]
max-complexity = 10
ignore =
    E203 W503
docstring-convention = pep257
exclude = .tox,__pycache__
