# SPDX-License-Identifier: Apache-2.0

options:
  fail_fast: false
  parallel: false

sessions:
  - name: "qemu-intel64-smoke"
    confpath: ntfc/configs/qemu-intel64/smoke/config.yaml
    testpath: ntfc/tests/smoke
  - name: "qemu-intel64-ip-pair"
    confpath: ntfc/configs/qemu-intel64/ip-pair/config.yaml
    testpath: ntfc/tests/ip
    resources: [tl-br0]
  - name: "qemu-intel64-modbus-rtu"
    confpath: ntfc/configs/qemu-intel64/modbus-rtu/config.yaml
    testpath: ntfc/tests/modbus
    resources: [ttyTL0]
  - name: "qemu-intel64-can-bus"
    confpath: ntfc/configs/qemu-intel64/can-bus/config.yaml
    testpath: ntfc/tests/can
    resources: [can0]
  - name: "qemu-intel64-can-char"
    confpath: ntfc/configs/qemu-intel64/can-char/config.yaml
    testpath: ntfc/tests/can
    resources: [can0]
  - name: "qemu-intel64-python"
    confpath: ntfc/configs/qemu-intel64/python/config.yaml
    testpath: ntfc/tests/python
  - name: "qemu-intel64-v9fs"
    confpath: ntfc/configs/qemu-intel64/v9fs/config.yaml
    testpath: ntfc/tests/fs
  - name: "qemu-intel64-router"
    confpath: ntfc/configs/qemu-intel64/router/config.yaml
    testpath: ntfc/tests/router
    resources: [tl-rbr0]
  - name: "qemu-intel64-router-hp2"
    confpath: ntfc/configs/qemu-intel64/router-hp2/config.yaml
    testpath: ntfc/tests/router/test_router_stress.py::test_router_duplex
    resources: [tl-rbr0]
  - name: "qemu-intel64-tls"
    confpath: ntfc/configs/qemu-intel64/tls/config.yaml
    testpath: ntfc/tests/tls
    resources: [tl-br0]
