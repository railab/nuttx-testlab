options:
  fail_fast: false
  parallel: false

sessions:
  - name: "qemu-armv8a-smoke"
    confpath: ntfc/configs/qemu-armv8a/smoke/config.yaml
    testpath: ntfc/tests/smoke
  - name: "qemu-armv8a-ip-pair"
    confpath: ntfc/configs/qemu-armv8a/ip-pair/config.yaml
    testpath: ntfc/tests/ip
    resources: [tl-br0]
  - name: "qemu-armv8a-modbus-rtu"
    confpath: ntfc/configs/qemu-armv8a/modbus-rtu/config.yaml
    testpath: ntfc/tests/modbus
    resources: [ttyTL0]
  - name: "qemu-armv8a-v9fs"
    confpath: ntfc/configs/qemu-armv8a/v9fs/config.yaml
    testpath: ntfc/tests/fs
  - name: "qemu-armv8a-v9fs-knsh"
    confpath: ntfc/configs/qemu-armv8a/v9fs-knsh/config.yaml
    testpath: ntfc/tests/fs
