  - name: "rv-virt-tls"
    confpath: ntfc/configs/rv-virt/tls/config.yaml
    testpath: ntfc/tests/tls
    resources: [tl-br0]
  - name: "rv-virt-vsock"
    confpath: ntfc/configs/rv-virt/vsock/config.yaml
