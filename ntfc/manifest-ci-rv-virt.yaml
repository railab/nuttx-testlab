  - name: "rv-virt-virtio-input"
    confpath: ntfc/configs/rv-virt/virtio-input/config.yaml
    testpath: ntfc/tests/input
  - name: "rv-virt-virtio-input-tablet"
    confpath: ntfc/configs/rv-virt/virtio-input-tablet/config.yaml
    testpath: ntfc/tests/input
  - name: "rv-virt-virtio-snd"
    confpath: ntfc/configs/rv-virt/virtio-snd/config.yaml
    testpath: ntfc/tests/sound
  - name: "rv-virt-virtio-snd-capture"
    confpath: ntfc/configs/rv-virt/virtio-snd-capture/config.yaml
    testpath: ntfc/tests/sound
  - name: "rv-virt-virtio-gpu"
    confpath: ntfc/configs/rv-virt/virtio-gpu/config.yaml
    testpath: ntfc/tests/gpu
  - name: "rv-virt-virtio-i2c"
    confpath: ntfc/configs/rv-virt/virtio-i2c/config.yaml
    testpath: ntfc/tests/i2c
  - name: "rv-virt-virtio-gpio"
    confpath: ntfc/configs/rv-virt/virtio-gpio/config.yaml
    testpath: ntfc/tests/gpio
  - name: "rv-virt-virtio-spi"
    confpath: ntfc/configs/rv-virt/virtio-spi/config.yaml
    testpath: ntfc/tests/spi
