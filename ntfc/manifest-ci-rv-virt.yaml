# SPDX-License-Identifier: Apache-2.0

options:
  fail_fast: false
  parallel: false

sessions:
  - name: "rv-virt-smoke"
    confpath: ntfc/configs/rv-virt/smoke/config.yaml
    testpath: ntfc/tests/smoke
  - name: "rv-virt-ip-pair"
    confpath: ntfc/configs/rv-virt/ip-pair/config.yaml
    testpath: ntfc/tests/ip
    resources: [tl-br0]
  - name: "rv-virt-modbus-rtu"
    confpath: ntfc/configs/rv-virt/modbus-rtu/config.yaml
    testpath: ntfc/tests/modbus
    resources: [ttyTL0]
  - name: "rv-virt-python"
    confpath: ntfc/configs/rv-virt/python/config.yaml
    testpath: ntfc/tests/python
