# SPDX-License-Identifier: Apache-2.0

options:
  fail_fast: false
  parallel: false

sessions:
  - name: "rv-virt-smoke"
    confpath: ntfc/configs/rv-virt/smoke/config.yaml
    testpath: ntfc/tests/smoke
  - name: "rv-virt-ip-pair"
    confpath: ntfc/configs/rv-virt/ip-pair/config.yaml
    testpath: ntfc/tests/ip
    resources: [tl-br0]
  - name: "rv-virt-modbus-rtu"
    confpath: ntfc/configs/rv-virt/modbus-rtu/config.yaml
    testpath: ntfc/tests/modbus
    resources: [ttyTL0]
  - name: "rv-virt-python"
    confpath: ntfc/configs/rv-virt/python/config.yaml
    testpath: ntfc/tests/python
  - name: "rv-virt-v9fs"
    confpath: ntfc/configs/rv-virt/v9fs/config.yaml
    testpath: ntfc/tests/fs
  - name: "rv-virt-router"
    confpath: ntfc/configs/rv-virt/router/config.yaml
    testpath: ntfc/tests/router
    resources: [tl-rbr0]
  - name: "rv-virt-router-hp2"
    confpath: ntfc/configs/rv-virt/router-hp2/config.yaml
    testpath: ntfc/tests/router/test_router_stress.py::test_router_duplex
    resources: [tl-rbr0]
